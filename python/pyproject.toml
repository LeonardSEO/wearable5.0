[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whoop5"
version = "0.1.0"
description = "Reference decoder for the WHOOP 5.0 / MG Bluetooth LE protocol"
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
re = ["numpy", "scipy"]

[tool.setuptools]
packages = ["whoop5"]

[tool.setuptools.package-data]
whoop5 = ["whoop5_protocol.json"]
